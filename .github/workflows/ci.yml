name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate all mirrored skills
        run: node scripts/validate-skills.mjs

      - name: Refresh the skills.sh index
        if: github.event_name == 'push'
        working-directory: ${{ runner.temp }}
        run: npx --yes skills add mindtheflo/notis-skills --skill '*' --agent codex --yes --copy
